            <select name="Availability">
              <option value="Available">Available</option>
              <option value="Busy">Busy</option>
            </select>
          </div>
          <div class="field">
            <label>CV Summary <small>(shown on hover)</small></label>
            <textarea name="Summary" placeholder="Brief professional summary…"></textarea>
          </div>
          <div class="field">
            <label>Upload CV <small>(PDF or Word)</small></label>
            <div class="file-drop" id="fileDrop">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="fileLabel">Drop CV here or click to browse</span>
              <input type="file" id="cvFile" accept=".pdf,.doc,.docx">
            </div>
          </div>
          <button type="submit" class="btn-primary btn-full" id="submitBtn">Add Consultant</button>
        </form>
      </div>
    </div>

    <!-- REMOVE PANEL -->
    <div class="side-panel side-panel-wide" id="removePanel">
      <div class="panel-header">
        <h2>Remove Consultant</h2>
        <button class="panel-close" onclick="closePanel()">✕</button>
      </div>
      <div class="panel-body">
        <p class="panel-hint">Click <strong>Delete</strong> to remove a consultant. You have 6 seconds to undo.</p>
        <div class="table-wrap" style="margin-top:16px">
          <table id="removeTable">
            <thead></thead>
            <tbody><tr><td colspan="99" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
